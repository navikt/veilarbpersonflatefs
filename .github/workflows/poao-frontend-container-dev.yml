name: paoa frontend container dev

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/poao-frontend-container-dev.yml'
      - '.nais/poao-nais-dev.yaml'
  workflow_dispatch:

concurrency:
  group: pto_frontend_container_dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deploy gcp dev
        uses: nais/deploy/actions/deploy@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/poao-nais-dev.yaml
