name: paoa frontend container prod

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/poao-frontend-container-prod.yml'
      - '.nais/poao-nais-prod.yaml'

concurrency:
  group: pto_frontend_container_prod
  cancel-in-progress: true

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: deploy gcp prod
        uses: nais/deploy/actions/deploy@8f89cfaf111e66bc79b75aa18a66a49fffb565ee # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/poao-nais-prod.yaml
