name: Deploy to dev
run-name: Deploy ${{ github.ref_name }} to dev by @${{ github.actor }}
on:
  workflow_dispatch: # This workflow can be triggered manually from: https://github.com/navikt/veilarbpersonflatefs/actions/workflows/deploy-dev.yaml
  push:
    branches:
      - main
env:
  CI: true
  TZ: Europe/Amsterdam

jobs:
  deploy-dev:
    name: Deploy static files to dev
    uses: ./.github/workflows/deploy-static-files.yaml
    with:
      env: dev
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
      GCS_SA_KEY: ${{ secrets.GCS_SA_KEY_DEV }}

